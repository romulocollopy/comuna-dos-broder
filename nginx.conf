# Serves the presentation baked into the image. Pages live under /html/ and
# reference ../css and ../images, so the tree keeps that layout and / redirects
# to the entry page. TLS is Traefik's job.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;

    charset utf-8;
    charset_types text/css;

    gzip on;
    gzip_types text/css image/svg+xml;
    gzip_min_length 512;

    # Not content-hashed: revalidate, nginx's ETag turns repeats into 304s.
    add_header Cache-Control "no-cache" always;

    location = / {
        return 302 /html/index.html;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
